<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Service Desk</title>


    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #f4f6f8;

        }


        .login-card {

            width: 400px;

            max-width: 90%;

            background: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow:
                0 4px 20px
                rgba(0,0,0,0.08);

        }


        .logo {

            text-align: center;

            font-size: 25px;

            font-weight: bold;

            color: #172033;

            margin-bottom: 8px;

        }


        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 30px;

        }


        .form-group {

            margin-bottom: 20px;

        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 7px;

        }


        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #d8dce2;

            border-radius: 6px;

            font-size: 14px;

        }


        input:focus {

            outline: none;

            border-color: #172033;

        }


        button {

            width: 100%;

            padding: 12px;

            background: #172033;

            color: white;

            border: none;

            border-radius: 6px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            background: #27354f;

        }


        .error {

            background: #fff0f0;

            color: #c62828;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 20px;

            font-size: 14px;

        }

    </style>

</head>


<body>


<div class="login-card">


    <div class="logo">

        SERVICE DESK

    </div>


    <div class="subtitle">

        Sign in to your account

    </div>


    {% if error %}

        <div class="error">

            {{ error }}

        </div>

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label>

                Username

            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

        </div>


        <div class="form-group">

            <label>

                Password

            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

        </div>


        <button type="submit">

            Login

        </button>

    </form>


</div>


</body>

</html>
